version: '3.9'

services:
  db:
    image: postgres:15
    container_name: medilab-db
    restart: always
    environment:
      POSTGRES_USER: medilab
      POSTGRES_PASSWORD: medilab
      POSTGRES_DB: medilab
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: